name: Build bielarmorweap
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Unzip source folder
      run: |
        unzip -o *.zip
        ls -la
        if [ -d "bielarmorweap" ]; then
          mv bielarmorweap/* . 2>/dev/null || true
          mv bielarmorweap/.* . 2>/dev/null || true
          rm -rf bielarmorweap
        fi
        ls -la
        
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        
    - name: Grant execute permission for gradlew
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
        else
          echo "ERROR: gradlew not found in root directory!"
          exit 1
        fi
      
    - name: Build Minecraft Java 1.12.2 Mod
      run: ./gradlew build --no-daemon
      
    - name: Upload compiled JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: bielarmorweap-compiled-jar
        path: build/libs/*.jar

